; Dev-performance tuning for the Sail containers.
; The project lives on a Windows bind mount, where file stats are expensive —
; OPcache + a large realpath cache cut request time dramatically.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; Still pick up code edits, but re-stat at most every 5s — each stat is
; expensive through the Windows bind mount
opcache.validate_timestamps=1
opcache.revalidate_freq=5

realpath_cache_size=4096K
realpath_cache_ttl=600
