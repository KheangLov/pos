; Production PHP settings for the baked application image.

memory_limit = 512M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M
expose_php = Off

; The application code lives inside an immutable image layer, so PHP never
; needs to stat files looking for changes. This is the single biggest win
; available here — and it is only safe *because* the code cannot change at
; runtime (a new release means a new image, not an edit in place).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.jit = tracing
opcache.jit_buffer_size = 128M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Never render internal paths or source excerpts to a browser in production;
; APP_DEBUG=false covers Laravel's own error page, this covers PHP's.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
